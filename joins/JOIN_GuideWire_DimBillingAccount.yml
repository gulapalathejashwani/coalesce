        join:
          joinCondition: |
            FROM {{ ref('SRC', 'bc_account') }} bc_account
            LEFT JOIN {{ ref('SRC', 'bctl_accounttype') }} bctl_accounttype
              ON bctl_accounttype.ID = bc_account.AccountType
            LEFT JOIN {{ ref('SRC', 'bc_ParentAcct') }} bc_ParentAcct
              ON bc_ParentAcct.ID = bc_account.ID
            LEFT JOIN {{ ref('SRC', 'bc_account') }} bc_account_parent
              ON bc_account_parent.ID = bc_ParentAcct.ParentAccountID
            LEFT JOIN {{ ref('SRC', 'bctl_billinglevel') }} bctl_billinglevel
              ON bctl_billinglevel.ID = bc_account.BillingLevel
            LEFT JOIN {{ ref('SRC', 'bctl_customerservicetier') }} bctl_customerservicetier
              ON bctl_customerservicetier.ID = bc_account.ServiceTier
            LEFT JOIN {{ ref('SRC', 'bc_securityzone') }} bc_securityzone
              ON bc_securityzone.ID = bc_account.SecurityZoneID
            LEFT JOIN (
              SELECT 
                acr.AccountID,
                c.DisplayName as InsuredName,
                a.AddressLine1 as InsuredAddress,
                s.Name as State
              FROM {{ ref('SRC', 'bc_accountcontact') }} ac
              JOIN {{ ref('SRC', 'bc_accountcontactrole') }} acr ON ac.ID = acr.AccountContactID
              JOIN {{ ref('SRC', 'bctl_accountrole') }} ar ON acr.AccountRole = ar.ID
              LEFT JOIN {{ ref('SRC', 'bc_contact') }} c ON ac.ContactID = c.ID
              LEFT JOIN {{ ref('SRC', 'bc_address') }} a ON c.PrimaryAddressID = a.ID
              LEFT JOIN {{ ref('SRC', 'bctl_state') }} s ON a.State = s.ID
              WHERE ar.Name = 'Insured'
            ) InsuredInfo ON InsuredInfo.AccountID = bc_account.ID
            LEFT JOIN {{ ref('SRC', 'bctl_delinquencystatus') }} bctl_delinquencystatus
              ON bctl_delinquencystatus.ID = bc_account.DelinquencyStatus
            LEFT JOIN {{ ref('SRC', 'bctl_accountsegment') }} bctl_accountsegment
              ON bctl_accountsegment.ID = bc_account.Segment
        name: JOIN_GuideWire_DimBillingAccount
